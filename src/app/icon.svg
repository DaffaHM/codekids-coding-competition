<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F7DF3"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Gold Sparkle Gradient -->
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Container with Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#softGlow)"/>

  <!-- Subtle Top Gloss Accent -->
  <path d="M48 136 C 48 88, 88 48, 136 48 L 376 48 C 424 48, 464 88, 464 136 C 464 180, 48 200, 48 136 Z" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Left Bracket < (Crisp Bold White) -->
  <path d="M190 176 L106 256 L190 336" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / (Vibrant Sunny Yellow #FFD84D) -->
  <path d="M294 156 L218 356" stroke="url(#starGrad)" stroke-width="44" stroke-linecap="round"/>

  <!-- Right Bracket > (Crisp Bold White) -->
  <path d="M322 176 L406 256 L322 336" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cute Golden Sparkle Star in top right -->
  <path d="M412 88 Q412 120 444 120 Q412 120 412 152 Q412 120 380 120 Q412 120 412 88 Z" fill="url(#starGrad)"/>
</svg>
